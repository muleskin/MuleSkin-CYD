server {
    listen 8000;
    listen [::]:8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The page re-fetches manifests and versions.json with no-store; keep
    # the server from handing out a stale copy after the bins are swapped.
    # Anything not baked into the image falls back to /firmware, so a
    # directory of release bins can be mounted there at run time.
    location ~* \.(json|bin|sig)$ {
        add_header Cache-Control "no-store";
        types { application/json json; application/octet-stream bin sig; }
        try_files $uri @firmware;
    }

    location @firmware {
        root /firmware;
        add_header Cache-Control "no-store";
        types { application/json json; application/octet-stream bin sig; }
        try_files $uri =404;
    }
}
