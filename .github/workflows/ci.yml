# Builds every board the web flasher offers and runs the host tests, on every
# push and pull request. It builds and checks only: nothing is signed,
# published or deployed from here (releases: tools/release.sh, deploy/README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # mbedtls for test/ota_sig_test.cpp: the firmware update's signature
      # check against real mbedtls (the Makefile skips it where there is none).
      - name: mbedtls
        run: sudo apt-get update -q && sudo apt-get install -y -q libmbedtls-dev
      - name: Host tests
        run: make -C test -k -j"$(nproc)"
      # The bench scripts (tools/bench/) run on a plugged-in board, so nothing
      # here exercises them: at least they must import and print their help,
      # and the server-side quiet check must compile.
      - name: Bench scripts load
        run: |
          pip install -q pyserial
          cd tools/bench
          for s in nvs_snapshot push_bench ota_e2e; do python $s.py --help >/dev/null; done
          python -m py_compile ../../deploy/ntfy/quiet-check.py ../flasher_versions.py
      # The web flasher's pages: every inline script has to parse (nothing
      # else builds them, and a broken one is a dead page after a deploy).
      - name: Flasher pages parse
        run: node tools/check_flasher_js.js
      # redeploy.sh's deploy-status.json (valid JSON whatever the message) and
      # quiet-check.py's pushes about it.
      - name: Deploy status
        run: python3 tools/test_deploy_status.py

  # The emulator renders the main screens and sim/screens_check.py compares
  # them with sim/golden/: a moved row, a clipped label or a wrong colour fails
  # here instead of on a board. A change that meant to move pixels re-renders
  # the references (python sim/screens_check.py --update) and commits them.
  screens:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Both: the screenshot renderer, and the live emulator that compiles
      # main.cpp itself -- which stopped linking in 4093d50 without CI
      # noticing, because only the first was built here.
      - name: Build the emulator
        # FW_VERSION pinned: the boot splash prints it, and git describe
        # would put this commit's hash in the picture.
        run: make -C sim -j"$(nproc)" muleskinsim muleskinsim-live FW_VERSION=sim
      - name: Compare the screens
        run: |
          pip install -q pillow
          python sim/screens_check.py
      - name: Keep the differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screen-diffs
          path: sim/out/diff/

  firmware:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The flasher's boards -- the same list as tools/build_flasher_bins.sh.
        env: [cyd, cyd-fast, cyd-ili9341, cyd-ili9341-fast, cyd32c, cyd35-fast,
              cyd35c-fast, freenove32, rlphantom-r, awok, twatch-s3, freenove-s3,
              freenove-s3-40, crowpanel7, nm-cyd-c5, marauder-v8]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, so FIRMWARE_VERSION is what a release build would say
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          # The C5 board uses a different platform from the rest; keep its
          # toolchains apart so the two don't keep replacing each other.
          key: pio-${{ (matrix.env == 'nm-cyd-c5' || matrix.env == 'marauder-v8') && 'c5' || 'esp32' }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ (matrix.env == 'nm-cyd-c5' || matrix.env == 'marauder-v8') && 'c5' || 'esp32' }}-
      - name: Install PlatformIO
        run: pip install -q platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      - name: Size
        run: |
          f=.pio/build/${{ matrix.env }}/firmware.bin
          echo "${{ matrix.env }}: $(stat -c%s "$f") bytes" >> "$GITHUB_STEP_SUMMARY"
