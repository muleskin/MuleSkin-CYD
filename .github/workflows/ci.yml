# Builds every board the web flasher offers and runs the host tests, on every
# push and pull request. It builds and checks only: nothing is signed,
# published or deployed from here (releases: tools/release.sh, deploy/README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mbedtls
        run: sudo apt-get update -q && sudo apt-get install -y -q libmbedtls-dev
      - name: Host tests
        run: make -C test -k -j"$(nproc)"

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The flasher's boards -- the same list as tools/build_flasher_bins.sh.
        env: [cyd, cyd-fast, cyd-ili9341, cyd-ili9341-fast, cyd32c, cyd35-fast,
              freenove32, rlphantom-r, awok, twatch-s3, freenove-s3, crowpanel7,
              nm-cyd-c5]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, so FIRMWARE_VERSION is what a release build would say
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          # The C5 board uses a different platform from the rest; keep its
          # toolchains apart so the two don't keep replacing each other.
          key: pio-${{ matrix.env == 'nm-cyd-c5' && 'c5' || 'esp32' }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.env == 'nm-cyd-c5' && 'c5' || 'esp32' }}-
      - name: Install PlatformIO
        run: pip install -q platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      - name: Size
        run: |
          f=.pio/build/${{ matrix.env }}/firmware.bin
          echo "${{ matrix.env }}: $(stat -c%s "$f") bytes" >> "$GITHUB_STEP_SUMMARY"
